[test]
coverage = true
coverageSkipTestFiles = true
coverageThreshold = { lines = 1.0, functions = 1.0, statements = 1.0 }
coverageReporter  = ["text", "lcov"]
# Only build output is ignored. NO TypeScript source is exempt: every `src/**` module in every
# package is held to the 100% threshold above, so a module cannot be excused from coverage by
# adding it here. `scripts/check-coverage-sources.mjs` additionally fails the build when a module
# with runtime code is never loaded by any test, which a threshold alone cannot see.
coveragePathIgnorePatterns = ["**/*.js"]
